{% set version = "1.3.16" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-hdf5r
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/hdf5r_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/hdf5r/hdf5r_{{ version }}.tar.gz
  sha256: 4cdfb76ae0f65dfcfbcf9b013959f942dad69c89bd481cc3b425c8b084e153b3
  patches:
    - patches/0001-minimal-libs-ucrt.patch
    {% if hdf5 == "2" %}
    # source: https://github.com/hhoeflin/hdf5r/commit/310f7206ce149c1a186ed59e473ce5a8d50637af
    - patches/0002-hdf5-2-compatibility.patch
    # source: https://github.com/mfansler/hdf5r/commit/bcf10508e336f529be7e036b0dc31dc6273dc034
    - patches/0003-hdf5-v2-compat-tests.patch
    {% endif %}

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]
  {% if hdf5 == "2" %}
  skip: true  # [win]
  {% endif %}

requirements:
  build:
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
    - r-bit64                      # [build_platform != target_platform]
    - r-r6                         # [build_platform != target_platform]
    - {{ compiler('c') }}          # [not win]
    - {{ stdlib('c') }}            # [not win]
    - {{ compiler('m2w64_c') }}    # [win]
    - {{ stdlib('m2w64_c') }}      # [win]
    - {{ posix }}filesystem        # [win]
    - {{ posix }}sed               # [win]
    - {{ posix }}grep              # [win]
    - {{ posix }}autoconf
    - {{ posix }}automake          # [not win]
    - {{ posix }}automake-wrapper  # [win]
    - pkg-config
    - {{ posix }}make
    - {{ posix }}coreutils         # [win]
    - {{ posix }}zip               # [win]
  host:
    - r-base
    - r-bit64
    - r-r6
    - hdf5
    - zlib
  run:
    - r-base
    - r-bit64
    - r-r6

test:
  requires:
    - r-testthat
  source_files:
    - tests/
  commands:
    - R -e "library('hdf5r')"                                                         # [not win]
    - R -e "testthat::test_file('tests/testthat.R', stop_on_failure=TRUE)"            # [not win]
    - "\"%R%\" -e \"library('hdf5r')\""                                               # [win]
    - "\"%R%\" -e \"testthat::test_file('tests/testthat.R', stop_on_failure=TRUE)\""  # [win]

about:
  home: https://hhoeflin.github.io/hdf5r/
  dev_url: https://github.com/hhoeflin/hdf5r/
  license: Apache-2.0
  license_file: LICENSE
  summary: |
    HDF5 is a data model, library and file format for storing  and managing 
    large amounts of data. This package provides a nearly feature complete, 
    object oriented  wrapper for the HDF5 API

extra:
  recipe-maintainers:
    - ocefpaf
    - conda-forge/r
